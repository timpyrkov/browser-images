<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Downloader</title>
  <link rel="stylesheet" href="styles.css">

</head>
<body class="popup">
  <div class="container popup-container">
    <h1 class="gradient-text">Image Downloader</h1>
    <p class="popup-description">Scans all open tabs for "main" image and downloads to a subfolder in your Downloads folder.</p>
    <div class="button-group">
      <button id="scan-button" class="btn btn-green">
        <span class="gradient-text">Scan & Download</span>
      </button>
      <button id="settings-button" class="btn btn-grey">
        <span class="gradient-text">Settings</span>
      </button>
      <div id="status-message" style="margin-top: 1em; min-height: 1.5em; text-align: center;"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
